<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심야 비상 구급상자 지도</title>

    <style>
        /* 모든 요소의 크기 계산 방식 통일 */
        * {
            box-sizing: border-box;
        }

        /* 페이지 기본 설정 */
        body {
            margin: 0;
            font-family: 'Malgun Gothic', sans-serif;
            color: #222;
        }

        /* 화면을 왼쪽과 오른쪽으로 분할 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* 왼쪽 검색 영역 */
        .sidebar {
            width: 360px;
            min-width: 300px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
            background-color: #fff;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 22px;
            color: #111;
        }

        .description {
            margin: 0 0 16px;
            color: #666;
            font-size: 13px;
        }

        /* 카테고리 탭 영역 */
        .category-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .tab-button {
            flex: 1;
            padding: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f8f9fa;
            color: #444;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-button:hover {
            background-color: #e9ecef;
        }

        .tab-button.active {
            background-color: #333;
            color: #fff;
            border-color: #333;
        }

        /* 검색창과 버튼 배치 */
        .search-form {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        #searchInput {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        #searchButton {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            background-color: #fee500;
            font-weight: bold;
            cursor: pointer;
        }

        #searchButton:hover {
            background-color: #f2dc00;
        }

        /* 현재 위치 버튼 */
        #locationButton {
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
        }

        #locationButton:hover {
            background-color: #f1f3f5;
        }

        /* 상태 안내 문구 */
        #status {
            margin: 0 0 12px;
            color: #666;
            font-size: 12px;
            line-height: 1.4;
        }

        /* 검색 결과 영역 */
        #resultList {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            border-top: 1px solid #eee;
        }

        /* 검색 결과 항목 */
        .result-item {
            padding: 12px 6px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .result-item:hover,
        .result-item:focus {
            background-color: #f7f7f7;
            outline: none;
        }

        .place-name {
            margin: 0 0 5px;
            font-size: 14px;
            font-weight: bold;
            color: #1a0dab;
        }

        .place-address {
            margin: 0 0 4px;
            color: #555;
            font-size: 12px;
            line-height: 1.4;
        }

        .place-category {
            margin: 0;
            color: #888;font-size: 11px;
        }

        /* 인포윈도우 스타일 */
        .info-window {
            padding: 10px;
            font-size: 12px;
            max-width: 200px;
            line-height: 1.4;
        }

        .info-window-title {
            font-weight: bold;
            margin-bottom: 4px;
            color: #111;
        }

        .info-window-address {
            color: #666;
        }

        /* 오른쪽 지도 영역 */
        .map-area {
            flex: 1;
            min-width: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* 반응형 모바일 설정 */
        @media (max-width: 600px) {
            .sidebar {
                width: 45%;
                min-width: 170px;
                padding: 12px;
            }

            h1 {
                font-size: 18px;
            }

            .tab-button {
                font-size: 11px;
                padding: 8px 0;
            }

            #searchButton {
                padding: 8px;
            }
        }
    </style>

    <!-- 카카오맵 SDK를 불러오고 services 라이브러리 사용 -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=960e791f85bf75659f52b74ca3e85737&libraries=services&autoload=false"></script>
</head>

<body>
    <div class="container">

        <!-- 왼쪽: 탭, 검색창 및 결과 목록 -->
        <aside class="sidebar">
            <h1>심야 비상 구급상자</h1>
            <p class="description">주변의 편의점, 병원, 약국을 찾아보세요.</p>

            <!-- 카테고리 탭 버튼 3개 -->
            <div class="category-tabs">
                <button type="button" class="tab-button active" data-category="CS2">편의점</button>
                <button type="button" class="tab-button" data-category="HP8">병원</button>
                <button type="button" class="tab-button" data-category="PM9">약국</button>
            </div>

            <!-- 키워드 검색 폼 -->
            <form class="search-form" id="searchForm">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="키워드 추가 검색 (예: 24시)"
                    autocomplete="off"
                    aria-label="장소 검색어"
                >
                <button type="submit" id="searchButton">검색</button>
            </form>

            <button type="button" id="locationButton">현재 위치로 이동</button>

            <p id="status" role="status" aria-live="polite">지도를 불러오는 중입니다.</p>

            <div id="resultList"></div>
        </aside>

        <!-- 오른쪽: 카카오맵 -->
        <main class="map-area">
            <div id="map"></div>
        </main>

    </div>

    <script>
        // 전역 상태 변수
        let map = null;
        let placesService = null;
        let currentMarker = null;
        let placeMarkers = [];
        let activeInfoWindow = null;
        let selectedCategory = "CS2"; // 기본 카테고리: 편의점(CS2)

        // 초기 위치 설정 (기본값: 서울시청)
        let currentPosition = {
            lat: 37.5665,
            lng: 126.9780
        };

        // 카테고리별 마커 이미지 생성 (Data URL)
        const markerImages = {
            // 편의점 (파란색 배경 + 24시 표시)
            CS2: createCustomMarkerImage("data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
                    <circle cx="18" cy="18" r="16" fill="#0288D1" stroke="#FFFFFF" stroke-width="2"/>
                    <text x="18" y="22" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">24H</text>
                </svg>
            `)),
            // 병원 (빨간색 배경 + 십자가)
            HP8: createCustomMarkerImage("data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
                    <circle cx="18" cy="18" r="16" fill="#D32F2F" stroke="#FFFFFF" stroke-width="2"/>
                    <path d="M15 10h6v5h5v6h-5v5h-6v-5h-5v-6h5z" fill="#FFFFFF"/>
                </svg>
            `)),
            // 약국 (주황색 배경 + 알약 아이콘)
            PM9: createCustomMarkerImage("data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
                    <circle cx="18" cy="18" r="16" fill="#E65100" stroke="#FFFFFF" stroke-width="2"/>
                    <rect x="11" y="15" width="14" height="6" rx="3" fill="#FFFFFF" transform="rotate(-30 18 18)"/>
                </svg>
            `))
        };

        // HTML 요소 참조
        const searchForm = document.getElementById("searchForm");
        const searchInput = document.getElementById("searchInput");
        const locationButton = document.getElementById("locationButton");
        const resultList = document.getElementById("resultList");
        const statusText = document.getElementById("status");
        const tabButtons = document.querySelectorAll(".tab-button");

        // 카카오맵 마커 객체 생성 함수
        function createCustomMarkerImage(src) {
            const imageSize = new kakao.maps.Size(36, 36);
            const imageOption = { offset: new kakao.maps.Point(18, 18) };
            return new kakao.maps.MarkerImage(src, imageSize, imageOption);
        }

        // 페이지 및 SDK 로드 완료 시 초기화
        window.addEventListener("load", function () {
            if (!window.kakao || !window.kakao.maps) {
                statusText.textContent = "카카오맵 SDK 로딩에 실패했습니다. 키 설정을 확인해 주세요.";
                return;
            }

            kakao.maps.load(function () {
                initializeMap();
                setupEvents();
                getCurrentLocation();
            });
        });

        // 지도 생성 및 설정
        function initializeMap() {
            const mapContainer = document.getElementById("map");
            const mapOptions = {
                center: new kakao.maps.LatLng(currentPosition.lat, currentPosition.lng),
                level: 4
            };

            map = new kakao.maps.Map(mapContainer, mapOptions);
            placesService = new kakao.maps.services.Places();
        }

        // 이벤트 리스너 등록
        function setupEvents() {
            // 카테고리 탭 클릭 이벤트
            tabButtons.forEach(function (button) {
                button.addEventListener("click", function () {
                    tabButtons.forEach(btn => btn.classList.remove("active"));
                    this.classList.add("active");

                    selectedCategory = this.getAttribute("data-category");
                    searchByCategory();
                });
            });

            // 키워드 검색 이벤트
            searchForm.addEventListener("submit", function (event) {
                event.preventDefault();
                searchPlaces();
            });

            // 현재 위치 버튼 클릭
            locationButton.addEventListener("click", function () {
                getCurrentLocation();
            });
        }

        // GPS 현재 위치 가져오기 및 마커 표시
        function getCurrentLocation() {
            if (!map) return;

            if (!navigator.geolocation) {
                statusText.textContent = "현재 브라우저에서 위치 정보를 지원하지 않습니다.";
                searchByCategory();
                return;
            }

            statusText.textContent = "현재 위치를 확인하고 있습니다...";

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    currentPosition = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };

                    const currentLatLng = new kakao.maps.LatLng(currentPosition.lat, currentPosition.lng);
                    map.setCenter(currentLatLng);
                    map.setLevel(4);

                    // 기존 현재 위치 마커 제거
                    if (currentMarker) {
                        currentMarker.setMap(null);
                    }

                    // 현재 위치 마커 생성 (빨간색 동그라미)
                    currentMarker = new kakao.maps.Marker({
                        position: currentLatLng,
                        map: map
                    });

                    statusText.textContent = "현재 위치가 확인되었습니다.";
                    searchByCategory();
                },
                function (error) {
                    statusText.textContent = "위치 정보를 가져오지 못해 기본 위치 기준으로 검색합니다.";
                    searchByCategory();
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // 카테고리 기반 장소 검색 (현재 지도 중심 기준)
        function searchByCategory() {
            if (!map || !placesService) return;

            clearPlaceMarkers();
            closeInfoWindow();
            resultList.replaceChildren();

            const keyword = searchInput.value.trim();
            statusText.textContent = "주변 장소를 검색 중입니다...";

            const options = {
                location: map.getCenter(),
                radius: 2000, // 2km 반경 내 검색
                sort: kakao.maps.services.SortBy.DISTANCE
            };

            // 키워드가 있으면 키워드 검색, 없으면 카테고리 검색
            if (keyword) {
                placesService.keywordSearch(keyword, handleSearchResults, {
                    ...options,
                    category_group_code: selectedCategory
                });
            } else {
                placesService.categorySearch(selectedCategory, handleSearchResults, options);
            }
        }

        // 일반 키워드 검색
        function searchPlaces() {
            searchByCategory();
        }

        // 검색 결과 처리 콜백
        function handleSearchResults(data, status) {
            if (status === kakao.maps.services.Status.OK) {
                displayResults(data);
                statusText.textContent = "주변 장소 " + data.length + "곳을 찾았습니다.";
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                statusText.textContent = "주변 검색 결과가 없습니다.";
            } else {
                statusText.textContent = "검색 중 오류가 발생했습니다.";
            }
        }

        // 검색 결과 마커 및 리스트 출력
        function displayResults(places) {
            resultList.replaceChildren();

            places.forEach(function (place, index) {
                const position = new kakao.maps.LatLng(Number(place.y), Number(place.x));

                // 카테고리별 커스텀 마커 적용
                const marker = new kakao.maps.Marker({
                    position: position,
                    map: map,
                    image: markerImages[selectedCategory] || null
                });

                placeMarkers.push(marker);

                // 마커 클릭 시 인포윈도우 팝업 표시
                kakao.maps.event.addListener(marker, "click", function () {
                    showInfoWindow(marker, place);
                    map.panTo(position);
                });

                // 목록 아이템 생성
                const item = document.createElement("div");
                item.className = "result-item";
                item.tabIndex = 0;

                const name = document.createElement("p");
                name.className = "place-name";
                name.textContent = (index + 1) + ". " + place.place_name;

                const address = document.createElement("p");
                address.className = "place-address";
                address.textContent = place.road_address_name || place.address_name || "주소 정보 없음";

                const category = document.createElement("p");
                category.className = "place-category";
                category.textContent = place.category_name || "";

                item.append(name, address, category);

                // 목록 아이템 클릭 시 해당 위치로 이동 및 팝업 표시
                item.addEventListener("click", function () {
                    map.panTo(position);
                    map.setLevel(3);
                    showInfoWindow(marker, place);
                });

                resultList.appendChild(item);
            });
        }

        // 마커 클릭 시 정보 팝업(인포윈도우) 표시
        function showInfoWindow(marker, place) {
            closeInfoWindow();

            const addressText = place.road_address_name || place.address_name || "주소 정보 없음";
            const content = `
                <div class="info-window">
                    <div class="info-window-title">${place.place_name}</div>
                    <div class="info-window-address">${addressText}</div>
                </div>
            `;

            activeInfoWindow = new kakao.maps.InfoWindow({
                content: content,
                removable: true
            });

            activeInfoWindow.open(map, marker);
        }

        // 인포윈도우 닫기
        function closeInfoWindow() {
            if (activeInfoWindow) {
                activeInfoWindow.close();
                activeInfoWindow = null;
            }
        }

        // 기존 장소 마커 지우기
        function clearPlaceMarkers() {
            placeMarkers.forEach(function (marker) {
                marker.setMap(null);
            });
            placeMarkers = [];
        }
    </script>
</body>
</html>

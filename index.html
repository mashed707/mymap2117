
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색</title>

    <style>
        /* 모든 요소의 크기 계산 방식 통일 */
        * {
            box-sizing: border-box;
        }

        /* 페이지 기본 설정 */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #222;
        }

        /* 화면을 왼쪽과 오른쪽으로 분할 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* 왼쪽 검색 영역 */
        .sidebar {
            width: 360px;
            min-width: 300px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
            background-color: #fff;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 24px;
        }

        .description {
            margin: 0 0 20px;
            color: #777;
            font-size: 14px;
        }

        /* 검색창과 버튼 배치 */
        .search-form {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        #searchInput {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        #searchButton {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background-color: #fee500;
            cursor: pointer;
        }

        #searchButton:hover {
            background-color: #f2dc00;
        }

        /* 현재 위치 버튼 */
        #locationButton {
            padding: 11px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
        }

        /* 상태 안내 문구 */
        #status {
            margin: 0 0 12px;
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }

        /* 검색 결과 영역 */
        #resultList {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            border-top: 1px solid #eee;
        }

        /* 검색 결과 항목 */
        .result-item {
            padding: 14px 5px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .result-item:hover,
        .result-item:focus {
            background-color: #f7f7f7;
            outline: none;
        }

        .place-name {
            margin: 0 0 7px;
            font-size: 15px;
            font-weight: bold;
        }

        .place-address {
            margin: 0 0 5px;
            color: #666;
            font-size: 12px;
            line-height: 1.5;
        }

        .place-category {
            margin: 0;
            color: #888;
            font-size: 11px;
        }

        /* 오른쪽 지도 영역 */
        .map-area {
            flex: 1;
            min-width: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* 작은 화면에서도 두 영역을 유지 */
        @media (max-width: 600px) {
            .sidebar {
                width: 45%;
                min-width: 170px;
                padding: 12px;
            }

            h1 {
                font-size: 19px;
            }

            #searchButton {
                padding: 10px;
            }
        }
    </style>

    <!-- 카카오맵 SDK를 불러오고 services 라이브러리 사용 -->
    <script
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=960e791f85bf75659f52b74ca3e85737&libraries=services&autoload=false">
    </script>
</head>

<body>
    <div class="container">

        <!-- 왼쪽: 검색창과 결과 목록 -->
        <aside class="sidebar">
            <h1>장소 검색</h1>
            <p class="description">
                찾고 싶은 장소를 검색해 보세요.
            </p>

            <form class="search-form" id="searchForm">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="예: 카페, 도서관, 맛집"
                    autocomplete="off"
                    aria-label="장소 검색어"
                >
                <button type="submit" id="searchButton">
                    검색
                </button>
            </form>

            <button type="button" id="locationButton">
                현재 위치로 이동
            </button>

            <p id="status" role="status" aria-live="polite">
                지도를 불러오는 중입니다.
            </p>

            <div id="resultList"></div>
        </aside>

        <!-- 오른쪽: 카카오맵 -->
        <main class="map-area">
            <div id="map"></div>
        </main>

    </div>

    <script>
        // 지도와 검색 기능에 사용할 변수
        let map = null;
        let placesService = null;
        let currentMarker = null;
        let placeMarkers = [];

        // 현재 위치를 서울 시청 좌표로 초기 설정
        let currentPosition = {
            lat: 37.5665,
            lng: 126.9780
        };

        // HTML 요소 가져오기
        const searchForm = document.getElementById("searchForm");
        const searchInput = document.getElementById("searchInput");
        const locationButton = document.getElementById("locationButton");
        const resultList = document.getElementById("resultList");
        const statusText = document.getElementById("status");

        // 페이지와 SDK가 준비된 뒤 지도 초기화
        window.addEventListener("load", function () {
            // 카카오맵 SDK가 정상적으로 로드되었는지 확인
            if (!window.kakao || !window.kakao.maps) {
                statusText.textContent =
                    "카카오맵 SDK 로딩에 실패했습니다. JavaScript 키와 등록 도메인을 확인해 주세요.";
                return;
            }

            // 카카오맵 내부 모듈이 준비된 뒤 실행
            kakao.maps.load(function () {
                initializeMap();
                setupEvents();
                getCurrentLocation();
            });
        });

        // 지도 생성
        function initializeMap() {
            const mapContainer = document.getElementById("map");

            const mapOptions = {
                center: new kakao.maps.LatLng(
                    currentPosition.lat,
                    currentPosition.lng
                ),
                level: 5
            };

            // 지도 객체 생성
            map = new kakao.maps.Map(mapContainer, mapOptions);

            // 장소 검색 서비스 생성
            placesService = new kakao.maps.services.Places();

            statusText.textContent =
                "지도 준비 완료! 장소를 검색해 보세요.";
        }

        // 버튼과 검색창 이벤트 등록
        function setupEvents() {
            // 검색 버튼 또는 Enter 키로 검색
            searchForm.addEventListener("submit", function (event) {
                event.preventDefault();
                searchPlaces();
            });

            // 현재 위치 버튼 클릭
            locationButton.addEventListener("click", function () {
                getCurrentLocation();
            });
        }

        // 브라우저에서 현재 위치 가져오기
        function getCurrentLocation() {
            if (!map) {
                statusText.textContent = "지도를 준비하고 있습니다.";
                return;
            }

            // 위치 정보 기능 지원 여부 확인
            if (!navigator.geolocation) {
                statusText.textContent =
                    "현재 브라우저에서는 위치 정보를 지원하지 않습니다.";
                return;
            }

            statusText.textContent =
                "위치 권한을 확인하고 있습니다.";

            // 사용자의 위치 정보 권한 요청
            navigator.geolocation.getCurrentPosition(
                function (position) {
                    // 실제 위치 좌표 저장
                    currentPosition = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };

                    const currentLatLng = new kakao.maps.LatLng(
                        currentPosition.lat,
                        currentPosition.lng
                    );

                    // 현재 위치로 지도 이동
                    map.setCenter(currentLatLng);

                    // 지도 확대 레벨 5로 설정
                    map.setLevel(5);

                    // 기존 현재 위치 마커 제거
                    if (currentMarker) {
                        currentMarker.setMap(null);
                    }

                    // 현재 위치에 마커 표시
                    currentMarker = new kakao.maps.Marker({
                        position: currentLatLng,
                        map: map
                    });

                    statusText.textContent =
                        "현재 위치를 지도에 표시했습니다.";
                },
                function (error) {
                    // 위치 확인 실패 원인 안내
                    if (error.code === error.PERMISSION_DENIED) {
                        statusText.textContent =
                            "위치 권한이 거부되었습니다. 서울 시청을 기준으로 지도를 표시합니다.";
                    } else if (error.code === error.TIMEOUT) {
                        statusText.textContent =
                            "위치 확인 시간이 초과되었습니다.";
                    } else {
                        statusText.textContent =
                            "현재 위치를 확인하지 못했습니다. 서울 시청을 기준으로 지도를 표시합니다.";
                    }
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // 기존 검색 결과 마커 모두 제거
        function clearPlaceMarkers() {
            placeMarkers.forEach(function (marker) {
                marker.setMap(null);
            });

            placeMarkers = [];
        }

        // 키워드로 장소 검색
        function searchPlaces() {
            const keyword = searchInput.value.trim();

            if (!map || !placesService) {
                statusText.textContent = "지도를 준비하고 있습니다.";
                return;
            }

            if (keyword === "") {
                statusText.textContent =
                    "검색어를 입력해 주세요.";
                searchInput.focus();
                return;
            }

            statusText.textContent = "장소를 검색하고 있습니다.";
            resultList.replaceChildren();
            clearPlaceMarkers();

            // 지도 중심 좌표를 기준으로 가까운 장소 검색
            const searchOptions = {
                location: map.getCenter(),
                sort: kakao.maps.services.SortBy.DISTANCE
            };

            placesService.keywordSearch(
                keyword,
                function (data, result) {
                    if (result === kakao.maps.services.Status.OK) {
                        displayResults(data);

                        statusText.textContent =
                            "검색 결과 " + data.length + "개를 찾았습니다.";
                    } else if (
                        result === kakao.maps.services.Status.ZERO_RESULT
                    ) {
                        statusText.textContent =
                            "검색 결과가 없습니다. 다른 검색어를 입력해 보세요.";
                    } else {
                        statusText.textContent =
                            "검색 중 오류가 발생했습니다. 다시 시도해 주세요.";
                    }
                },
                searchOptions
            );
        }

        // 검색 결과 목록과 지도 마커 표시
        function displayResults(places) {
            resultList.replaceChildren();

            const bounds = new kakao.maps.LatLngBounds();

            places.forEach(function (place, index) {
                const position = new kakao.maps.LatLng(
                    Number(place.y),
                    Number(place.x)
                );

                // 지도에 장소 마커 추가
                const marker = new kakao.maps.Marker({
                    position: position,
                    map: map
                });

                placeMarkers.push(marker);
                bounds.extend(position);

                // 마커 클릭 시 해당 장소로 이동
                kakao.maps.event.addListener(
                    marker,
                    "click",
                    function () {
                        moveToPlace(place);
                    }
                );

                // 검색 결과 항목 생성
                const item = document.createElement("div");
                item.className = "result-item";
                item.tabIndex = 0;
                item.setAttribute("role", "button");

                const name = document.createElement("p");
                name.className = "place-name";
                name.textContent =
                    (index + 1) + ". " + place.place_name;

                const address = document.createElement("p");
                address.className = "place-address";
                address.textContent =
                    place.road_address_name ||
                    place.address_name ||
                    "주소 정보 없음";

                const category = document.createElement("p");
                category.className = "place-category";
                category.textContent =
                    place.category_name || "카테고리 정보 없음";

                // 장소 정보를 결과 항목에 추가
                item.append(name, address, category);

                // 클릭하거나 키보드로 선택하면 지도 이동
                item.addEventListener("click", function () {
                    moveToPlace(place);
                });

                item.addEventListener("keydown", function (event) {
                    if (
                        event.key === "Enter" ||
                        event.key === " "
                    ) {
                        event.preventDefault();
                        moveToPlace(place);
                    }
                });

                resultList.appendChild(item);
            });

            // 모든 검색 결과가 보이도록 지도 범위 조정
            if (places.length > 0) {
                map.setBounds(bounds);
            }
        }

        // 선택한 장소를 지도 중심으로 이동
        function moveToPlace(place) {
            const position = new kakao.maps.LatLng(
                Number(place.y),
                Number(place.x)
            );

            map.panTo(position);

            // 선택한 장소를 자세히 볼 수 있도록 확대
            map.setLevel(3);
        }
    </script>
</body>
</html>
